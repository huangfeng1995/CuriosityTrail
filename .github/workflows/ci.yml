name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server-test:
    name: 后端单测
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/server/package-lock.json
      - name: 安装依赖
        working-directory: web/server
        run: npm ci
      - name: 跑单测
        working-directory: web/server
        run: npm test

  client-build:
    name: 前端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/client/package-lock.json
      - name: 安装依赖
        working-directory: web/client
        run: npm ci
      - name: 跑单测
        working-directory: web/client
        run: npm test
      - name: 构建
        working-directory: web/client
        run: npm run build

  e2e:
    name: E2E 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            web/client/package-lock.json
            web/e2e/package-lock.json
      - name: 构建前端（E2E 服务的是 dist）
        working-directory: web/client
        run: npm ci && npm run build
      - name: 安装 E2E 依赖
        working-directory: web/e2e
        run: npm ci
      - name: 安装浏览器
        working-directory: web/e2e
        run: npx playwright install --with-deps chromium
      - name: 跑 E2E
        working-directory: web/e2e
        run: npx playwright test
      - name: 上传测试报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/e2e/playwright-report
          retention-days: 7

  docker-build:
    name: Docker 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        run: docker build -t curiosity-trail:ci .
