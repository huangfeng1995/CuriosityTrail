<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PDF 拆分工作台</title>
<style>
:root{
  --bg:#f4f6f8; --card:#ffffff; --border:#e2e6ea; --border-strong:#cbd2d9;
  --text:#1b1f24; --muted:#6b7480; --primary:#1a6fd4; --primary-weak:#e9f1fc;
  --ok:#0f6e56; --ok-weak:#e6f4ef; --warn:#a35709; --warn-weak:#fdf3e3;
  --danger:#b3261e; --danger-weak:#fdecea;
  --radius:12px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:14px; line-height:1.6;
  padding-bottom:calc(24px + env(safe-area-inset-bottom));
}
.wrap{max-width:1360px;margin:0 auto;padding:16px}
h1{font-size:18px;font-weight:600;margin:0}
h2{font-size:14px;font-weight:600;margin:0 0 10px}
.topbar{
  background:var(--card);border-bottom:1px solid var(--border);
  padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  position:sticky;top:0;z-index:20;
}
.topbar .brand{display:flex;align-items:center;gap:8px}
.topbar .brand svg{color:var(--primary)}
.topbar .spacer{flex:1}
.status{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.status b{color:var(--text);font-weight:600}
.panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.panel-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.panel-head h2{flex:1;margin:0}
.btn{
  min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--border-strong);
  background:#fff;color:var(--text);font-size:14px;cursor:pointer;display:inline-flex;
  align-items:center;justify-content:center;gap:6px;font-family:inherit;
}
.btn:hover{border-color:var(--primary);color:var(--primary)}
.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn-primary:hover{background:#155cb0;color:#fff}
.btn-sm{min-height:36px;padding:0 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-danger:hover{border-color:var(--danger);color:var(--danger)}
input[type=text],input[type=number],select{
  font-size:16px;min-height:44px;padding:0 10px;border:1px solid var(--border-strong);
  border-radius:8px;background:#fff;color:var(--text);font-family:inherit;width:100%;
}
input[type=checkbox]{width:18px;height:18px}
.dropzone{
  border:2px dashed var(--border-strong);border-radius:var(--radius);padding:28px 16px;
  text-align:center;background:var(--card);cursor:pointer;
}
.dropzone.hover{border-color:var(--primary);background:var(--primary-weak)}
.dropzone .big{font-size:15px;font-weight:600;margin-bottom:4px}
.dropzone .sub{font-size:13px;color:var(--muted)}
.workspace{display:grid;grid-template-columns:minmax(300px,38%) 1fr;gap:16px;align-items:start}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px;max-height:640px;overflow-y:auto;padding:2px}
.thumb{position:relative;border:2px solid transparent;border-radius:8px;padding:4px;cursor:pointer;background:#fafbfc}
.thumb:hover{border-color:var(--border-strong)}
.thumb.sel{border-color:var(--primary);background:var(--primary-weak)}
.thumb img{width:100%;display:block;border-radius:4px;background:#fff;min-height:120px}
.thumb .pg{font-size:12px;color:var(--muted);text-align:center;padding-top:2px}
.thumb .flag{position:absolute;left:4px;right:4px;height:4px;border-radius:2px;background:var(--primary)}
.thumb .cut{position:absolute;left:0;right:0;height:0;border-top:2px dashed #e07b39}
.seg{border:1px solid var(--border);border-left:3px solid var(--border-strong);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.seg.inline{border-left-color:#e07b39}
.seg.orphan{border-left-color:#8a8f98}
.seg-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.badge{background:var(--primary-weak);color:var(--primary);font-size:12px;font-weight:600;
  border-radius:6px;padding:2px 8px;min-width:26px;text-align:center}
.seg-name{flex:1;min-width:150px}
.seg-meta{font-size:12px;color:var(--muted);width:100%;margin-top:2px}
.seg-note{font-size:12px;color:var(--warn);background:var(--warn-weak);border-radius:6px;padding:4px 8px;margin-top:6px}
.seg-actions{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.tblwrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:760px}
th{font-size:12px;color:var(--muted);text-align:left;padding:6px 6px;font-weight:500;white-space:nowrap}
td{padding:4px 6px;vertical-align:middle}
td input[type=text],td select{font-size:14px;min-height:38px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-top:12px}
.opt{display:flex;flex-direction:column;gap:4px}
.opt label{font-size:12px;color:var(--muted)}
.alert{border-radius:10px;padding:10px 14px;margin-bottom:16px;font-size:13px;display:flex;gap:8px;align-items:flex-start}
.alert-warn{background:var(--warn-weak);color:var(--warn);border:1px solid #f0d9b0}
.alert-ok{background:var(--ok-weak);color:var(--ok);border:1px solid #bfe3d5}
.alert-err{background:var(--danger-weak);color:var(--danger);border:1px solid #f3c3be}
.hidden{display:none}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:20px}
.pill{font-size:12px;border-radius:6px;padding:1px 7px;border:1px solid var(--border-strong);color:var(--muted)}
.pill-inline{background:var(--warn-weak);color:var(--warn);border-color:#f0d9b0}
.filelist{display:flex;flex-direction:column;gap:6px}
.fileitem{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:8px;padding:8px 10px;flex-wrap:wrap}
.fileitem .nm{flex:1;min-width:180px;font-weight:500;word-break:break-all}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:#1b1f24;color:#fff;
  padding:10px 18px;border-radius:8px;font-size:13px;z-index:50;opacity:.96}
.ic{display:inline-flex;align-items:center}
.ic svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.segmented{display:inline-flex;border:1px solid var(--border-strong);border-radius:8px;overflow:hidden}
.seg-btn{border:0;background:#fff;color:var(--muted);font-size:14px;padding:0 14px;min-height:36px;cursor:pointer;font-family:inherit}
.seg-btn.active{background:var(--primary);color:#fff}
.sub{font-size:13px;color:var(--muted)}
/* 模式切换：批量模式隐藏单文件区与单文件按钮 */
body.mode-batch #singleView{display:none}
body.mode-single #batchView{display:none}
body.mode-batch #btnDetect,body.mode-batch #btnExport{display:none}
body.mode-batch .status{display:none}
@media (max-width:900px){
  .workspace{grid-template-columns:1fr}
  .thumbs{max-height:420px}
  .topbar{padding:10px 12px}
  .wrap{padding:12px}
}
</style>
</head>
<body class="mode-single">

<header class="topbar">
  <div class="brand">
    <span class="ic"><svg viewBox="0 0 24 24"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5"/></svg></span>
    <h1>PDF 拆分工作台</h1>
  </div>
  <div class="segmented" id="modeToggle" role="tablist" aria-label="模式切换">
    <button class="seg-btn active" data-view="single">单文件</button>
    <button class="seg-btn" data-view="batch">批量拆分</button>
  </div>
  <div class="spacer"></div>
  <div class="status" id="status"></div>
  <button class="btn btn-primary btn-sm" id="btnDetect" disabled>
    <span class="ic"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></span>
    开始识别
  </button>
  <button class="btn btn-sm" id="btnExport" disabled>
    <span class="ic"><svg viewBox="0 0 24 24"><path d="M12 4v11m0 0l-4-4m4 4l4-4"/><path d="M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg></span>
    导出
  </button>
</header>

<div class="wrap">

  <div id="singleView">
  <div id="alertBox"></div>

  <section class="panel" id="filePanel">
    <div class="dropzone" id="dropzone">
      <div class="big">点击选择 PDF，或把文件拖到这里</div>
      <div class="sub">文件只在本机处理，不会上传到任何服务器</div>
    </div>
    <input type="file" id="fileInput" accept="application/pdf,.pdf" class="hidden">
  </section>

  <div class="workspace">
    <section class="panel">
      <div class="panel-head">
        <h2>页面预览</h2>
        <span class="pill" id="selInfo">未选择</span>
      </div>
      <div class="thumbs" id="thumbs"><div class="empty">先选择一个 PDF 文件</div></div>
      <div class="opts" style="margin-top:12px">
        <div class="opt"><label>在第 <span id="insPageLabel">1</span> 页插入分界点</label>
          <div style="display:flex;gap:8px">
            <input type="number" id="insPos" value="0" min="0" max="95" step="5" style="max-width:92px" title="距页顶百分比，0 表示整页起点">
            <input type="text" id="insName" placeholder="材料名称" style="flex:1">
          </div>
        </div>
        <div class="opt" style="justify-content:flex-end">
          <button class="btn btn-sm" id="btnInsert" disabled>插入分界点</button>
        </div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>分段结果</h2>
        <span class="pill" id="segCount">0 段</span>
      </div>
      <div id="segments"><div class="empty">识别后在这里显示并校正分段</div></div>
    </section>
  </div>

  <section class="panel">
    <div class="panel-head">
      <h2>拆分规则</h2>
      <button class="btn btn-sm" id="btnAddRule">新增规则</button>
      <button class="btn btn-sm" id="btnLoadRule">读取默认</button>
      <button class="btn btn-sm" id="btnImpRule">导入</button>
      <button class="btn btn-sm" id="btnExpRule">导出</button>
      <input type="file" id="ruleInput" accept=".json,application/json" class="hidden">
    </div>
    <div class="tblwrap">
      <table id="ruleTable">
        <thead><tr>
          <th style="width:44px">启用</th><th style="min-width:130px">材料名称</th>
          <th style="width:110px">类型</th><th style="min-width:160px">关键字 / 正则</th>
          <th style="width:110px">匹配范围</th><th style="width:74px">页内切分</th>
          <th style="width:96px">段名来源</th>
          <th style="width:56px">操作</th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <div class="opts">
      <div class="opt"><label>使用 PDF 书签（目录）</label>
        <select id="optOutline"><option value="1">使用</option><option value="0">不使用</option></select>
      </div>
      <div class="opt"><label>页内切分总开关</label>
        <select id="optInline"><option value="0">关闭（只按页拆）</option><option value="1">开启（按内容位置拆）</option></select>
      </div>
      <div class="opt"><label>未识别头部页处理</label>
        <select id="optOrphan"><option value="prepend">并入第一段</option><option value="separate">单独成段</option></select>
      </div>
      <div class="opt"><label>排除正则（过滤续页标题）</label>
        <input type="text" id="optExclude">
      </div>
      <div class="opt"><label>文件名模板</label>
        <input type="text" id="optFilename">
      </div>
      <div class="opt"><label>孤立段名称</label>
        <input type="text" id="optOrphanName">
      </div>
    </div>
  </section>

  <section class="panel hidden" id="outputPanel">
    <div class="panel-head"><h2>导出结果</h2><span class="pill" id="outDir"></span></div>
    <div class="filelist" id="fileList"></div>
  </section>
  </div><!-- /singleView -->

  <div id="batchView">
    <section class="panel">
      <div class="panel-head">
        <h2>批量拆分</h2>
        <span class="pill" id="batchCount">未选择</span>
      </div>
      <div class="dropzone" id="batchDrop">
        <div class="big">点击选择多个 PDF，或把文件拖到这里</div>
        <div class="sub">一次处理多个文件，按当前规则自动识别并拆分；全部在本机完成，不外传</div>
      </div>
      <input type="file" id="batchInput" accept="application/pdf,.pdf" multiple class="hidden">
      <div class="filelist" id="batchFiles" style="margin-top:12px"></div>
      <div style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap">
        <button class="btn btn-primary" id="btnBatchRun" disabled>
          <span class="ic"><svg viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M9 7V5h6v2"/><path d="M6 7l1 13h10l1-13"/></svg></span>
          开始批量拆分
        </button>
        <button class="btn btn-sm" id="btnBatchClear">清空列表</button>
      </div>
    </section>

    <section class="panel hidden" id="batchResult">
      <div class="panel-head"><h2>批量结果</h2><span class="pill" id="batchSummary"></span></div>
      <div class="filelist" id="batchResultList"></div>
    </section>
  </div>

</div>

<script>
"use strict";

const ICON = {
  trash:'<svg viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M9 7V5h6v2"/><path d="M6 7l1 13h10l1-13"/></svg>',
  merge:'<svg viewBox="0 0 24 24"><path d="M8 4v6a4 4 0 004 4h8"/><path d="M17 11l3 3-3 3"/></svg>',
  down:'<svg viewBox="0 0 24 24"><path d="M12 4v11m0 0l-4-4m4 4l4-4"/><path d="M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>',
  warn:'<svg viewBox="0 0 24 24"><path d="M12 4l9 16H3z"/><path d="M12 10v4"/><path d="M12 17h.01"/></svg>',
  ok:'<svg viewBox="0 0 24 24"><path d="M4 12l5 5L20 6"/></svg>',
};

const state = {
  docId:null, name:'', pages:[], boundaries:[], segments:[], checks:null,
  config:null, sel:1, thumbsBuilt:false, lastExport:null,
  mode:'single', batchFiles:[], lastBatch:null
};

const $ = s => document.querySelector(s);
const esc = v => String(v==null?'':v).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(msg){
  const old = $('.toast'); if(old) old.remove();
  const d = document.createElement('div');
  d.className='toast'; d.textContent=msg; document.body.appendChild(d);
  setTimeout(()=>d.remove(), 2600);
}

async function api(path, opts){
  const r = await fetch(path, opts);
  const j = await r.json().catch(()=>({ok:false,error:'服务返回异常'}));
  if(!j.ok) throw new Error(j.error || '请求失败');
  return j;
}

/* ---------- 规则配置读写 ---------- */

function collectConfig(){
  const rows = [...document.querySelectorAll('#ruleTable tbody tr')];
  const rules = [];
    rows.forEach(tr=>{
      if(!tr.querySelector('.r-on').checked) return;
      rules.push({
        name: tr.querySelector('.r-name').value.trim() || '未命名',
        type: tr.querySelector('.r-type').value,
        pattern: tr.querySelector('.r-pattern').value.trim(),
        scope: tr.querySelector('.r-scope').value,
        top_chars: 200,
        inline: tr.querySelector('.r-inline').checked,
        name_from: tr.querySelector('.r-namefrom') ? tr.querySelector('.r-namefrom').value : 'rule'
      });
    });
  const o = state.config.options;
  o.orphan_pages = $('#optOrphan').value;
  o.orphan_name = $('#optOrphanName').value.trim() || '前言';
  o.exclude = $('#optExclude').value;
  o.filename = $('#optFilename').value.trim() || '{index:02d}_{name}.pdf';
  o.inline_split = $('#optInline').value === '1';
  return {...state.config, use_outline: $('#optOutline').value==='1', rules, options:o};
}

function applyConfig(cfg){
  state.config = cfg;
  const o = cfg.options || {};
  $('#optOutline').value = cfg.use_outline ? '1':'0';
  $('#optInline').value = o.inline_split ? '1':'0';
  $('#optOrphan').value = o.orphan_pages || 'prepend';
  $('#optOrphanName').value = o.orphan_name || '前言';
  $('#optExclude').value = o.exclude || '';
  $('#optFilename').value = o.filename || '{index:02d}_{name}.pdf';
  renderRuleTable();
  saveRules();
}

function renderRuleTable(){
  const tb = document.querySelector('#ruleTable tbody');
  tb.innerHTML = '';
  (state.config.rules || []).forEach((r,i)=>{
    const tr = document.createElement('tr');
    tr.innerHTML =
      '<td><input type="checkbox" class="r-on" '+(r.enabled===false?'':'checked')+'></td>'+
      '<td><input type="text" class="r-name" value="'+esc(r.name)+'"></td>'+
      '<td><select class="r-type">'+
        ['keyword','regex','blank_page'].map(t=>
          '<option value="'+t+'"'+(r.type===t?' selected':'')+'>'+
          ({keyword:'关键字',regex:'正则',blank_page:'空白页'}[t])+'</option>').join('')+
      '</select></td>'+
      '<td><input type="text" class="r-pattern" value="'+esc(r.pattern||'')+'" placeholder="'+
        (r.type==='blank_page'?'无需填写':'如：费用签审单')+'"></td>'+
      '<td><select class="r-scope">'+
        ['top','page'].map(t=>'<option value="'+t+'"'+(r.scope===t?' selected':'')+'>'+
        ({top:'页首区域',page:'整页'}[t])+'</option>').join('')+
      '</select></td>'+
      '<td style="text-align:center"><input type="checkbox" class="r-inline" '+(r.inline?'checked':'')+'></td>'+
      '<td><select class="r-namefrom">'+
        ['rule','line','group'].map(t=>
          '<option value="'+t+'"'+(r.name_from===t?' selected':'')+'>'+
          ({rule:'规则名',line:'命中行',group:'正则分组'}[t])+'</option>').join('')+
      '</select></td>'+
      '<td><button class="btn btn-sm btn-danger r-del" title="删除"><span class="ic">'+ICON.trash+'</span></button></td>';
    tb.appendChild(tr);
  });
  tb.querySelectorAll('.r-del').forEach((b,i)=>b.onclick=()=>{
    state.config.rules.splice(i,1); renderRuleTable(); saveRules();
  });
  tb.querySelectorAll('input,select').forEach(el=>el.onchange=saveRules);
}

function saveRules(){
  try{
    const rows = [...document.querySelectorAll('#ruleTable tbody tr')];
    (state.config.rules||[]).forEach((r,i)=>{ if(rows[i]) r.enabled = rows[i].querySelector('.r-on').checked; });
    localStorage.setItem('wb_pdfsplit_rules', JSON.stringify(collectConfig()));
  }catch(e){}
}

/* ---------- 渲染 ---------- */

function refreshAll(){
  renderStatus();
  renderThumbs();
  renderSegments();
  renderAlert();
  $('#btnDetect').disabled = !state.docId;
  $('#btnExport').disabled = !state.docId || !state.segments.length;
  $('#btnInsert').disabled = !state.docId;
  $('#insPageLabel').textContent = state.sel;
}

function renderStatus(){
  const c = state.checks;
  let html = '';
  if(state.docId){
    html += '<span>原文件 <b>'+state.pages.length+'</b> 页</span>';
    html += '<span>分界点 <b>'+state.boundaries.length+'</b></span>';
  }
  if(c){
    html += '<span>输出 <b>'+c.output_pages+'</b> 页</span>';
    if(c.inline_blocks) html += '<span>页内块 <b>'+c.inline_blocks+'</b></span>';
    html += '<span>覆盖校验 <b style="color:'+(c.consistent?'var(--ok)':'var(--danger)')+'">'+
            (c.consistent?'通过':'不通过')+'</b></span>';
  }
  $('#status').innerHTML = html || '<span>等待选择 PDF</span>';
}

function renderThumbs(){
  const box = $('#thumbs');
  if(!state.docId){ box.innerHTML='<div class="empty">先选择一个 PDF 文件</div>'; state.thumbsBuilt=false; return; }
  if(!state.thumbsBuilt || box.children.length !== state.pages.length){
    box.innerHTML = state.pages.map(p=>
      '<div class="thumb" data-p="'+p.index+'">'+
        '<div class="flag hidden"></div>'+
        '<img loading="lazy" alt="第'+p.index+'页" data-src="/api/thumb?doc='+state.docId+'&page='+p.index+'&w=220">'+
        '<div class="pg">'+p.index+(p.blank?' · 无文字':'')+'</div>'+
      '</div>').join('');
    observeThumbs();
    state.thumbsBuilt = true;
  }
  const marks = {};
  state.boundaries.forEach(b=>{ (marks[b.page] = marks[b.page]||[]).push(b); });
  box.querySelectorAll('.thumb').forEach(el=>{
    const p = +el.dataset.p;
    el.querySelectorAll('.cut').forEach(n=>n.remove());
    const list = marks[p] || [];
    const flag = el.querySelector('.flag');
    flag.classList.toggle('hidden', !list.some(b=>!b.offset));
    el.classList.toggle('sel', p === state.sel);
    list.filter(b=>b.offset>0).forEach(b=>{
      const h = (state.pages[p-1]||{}).height || 842;
      const cut = document.createElement('div');
      cut.className='cut'; cut.style.top = (4 + b.offset/h*100) + '%';
      cut.title = b.name;
      el.appendChild(cut);
    });
  });
}

let io = null;
function observeThumbs(){
  if(io) io.disconnect();
  io = new IntersectionObserver(entries=>{
    entries.forEach(e=>{
      if(e.isIntersecting){
        const img = e.target;
        if(img.dataset.src){ img.src = img.dataset.src; delete img.dataset.src; }
        io.unobserve(img);
      }
    });
  },{rootMargin:'200px'});
  document.querySelectorAll('.thumbs img').forEach(img=>io.observe(img));
}

function renderSegments(){
  const box = $('#segments');
  $('#segCount').textContent = state.segments.length + ' 段';
  if(!state.segments.length){ box.innerHTML='<div class="empty">识别后在这里显示并校正分段</div>'; return; }
  box.innerHTML = state.segments.map((s,i)=>
    '<div class="seg '+(s.has_inline?'inline':'')+(s.source==='orphan'?' orphan':'')+'">'+
      '<div class="seg-head">'+
        '<span class="badge">'+s.index+'</span>'+
        '<input type="text" class="seg-name" data-i="'+i+'" value="'+esc(s.name)+'">'+
        '<span class="pill'+(s.has_inline?' pill-inline':'')+'">'+(s.has_inline?'页内切分':'整页')+'</span>'+
      '</div>'+
      '<div class="seg-meta">第 '+s.start_page+' - '+s.end_page+' 页 · '+s.blocks.length+' 块 · 来源 '+
        esc(s.source)+(s.matched?' · 命中「'+esc(s.matched)+'」':'')+'</div>'+
      (s.note?'<div class="seg-note">'+esc(s.note)+'</div>':'')+
      '<div class="seg-actions">'+
        (s.bi>=0?'<button class="btn btn-sm" data-act="merge" data-i="'+i+'"><span class="ic">'+ICON.merge+'</span>并入上一段</button>':'')+
        (i<state.segments.length-1?'<button class="btn btn-sm" data-act="mergeNext" data-i="'+i+'"><span class="ic">'+ICON.merge+'</span>并入下一段</button>':'')+
      '</div>'+
    '</div>').join('');
}

function renderAlert(){
  const box = $('#alertBox');
  const c = state.checks;
  let html = '';
  if(c && !c.consistent){
    html += '<div class="alert alert-err"><span class="ic">'+ICON.warn+'</span><div>覆盖校验未通过：'+
      esc((c.problems||[]).join('；')||'存在未覆盖或重叠区域')+'。请调整分界点后再导出。</div></div>';
  }
  const review = state.segments.filter(s=>s.has_inline || s.note);
  if(review.length){
    html += '<div class="alert alert-warn"><span class="ic">'+ICON.warn+'</span><div>以下 '+
      review.length+' 段建议人工复核：'+
      review.map(s=>esc(s.index+'. '+s.name)).join('、')+
      '（含页内切分或未识别的头部页，确认无误即可导出）</div></div>';
  }
  if(c && c.consistent && state.segments.length && !review.length){
    html += '<div class="alert alert-ok"><span class="ic">'+ICON.ok+'</span><div>校验通过：'+
      (c.page_level_only
        ? '共 '+c.output_pages+' 页，与原文件页数一致，不重不漏。'
        : '输出 '+c.output_pages+' 页（原 '+c.total_pages+' 页，含 '+c.inline_blocks+
          ' 个页内块），页面内容不重不漏。')+'</div></div>';
  }
  box.innerHTML = html;
}

/* ---------- 交互 ---------- */

async function openFile(file){
  if(!file) return;
  if(!/\.pdf$/i.test(file.name)) { toast('请选择 PDF 文件'); return; }
  toast('正在打开…');
  try{
    const j = await api('/api/open', {
      method:'POST',
      headers:{'X-File-Name': encodeURIComponent(file.name)},
      body: file
    });
    state.docId = j.doc_id; state.name = j.name; state.pages = j.pages;
    state.boundaries = []; state.segments = []; state.checks = null;
    state.sel = 1; state.thumbsBuilt = false;
    $('#filePanel').querySelector('.big').textContent = file.name;
    $('#filePanel').querySelector('.sub').textContent =
      j.page_count + ' 页' + (j.has_outline ? ' · 含 PDF 书签' : ' · 无书签');
    refreshAll();
    toast('已打开 '+j.page_count+' 页');
  }catch(e){ toast(e.message); }
}

async function doDetect(){
  if(!state.docId) return;
  toast('正在识别…');
  try{
    const j = await api('/api/detect', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({doc_id:state.docId, config: collectConfig()})
    });
    state.boundaries = j.boundaries || [];
    state.segments = j.segments || [];
    state.checks = j.checks || null;
    refreshAll();
    toast('识别到 '+state.boundaries.length+' 个分界点，分为 '+state.segments.length+' 段');
  }catch(e){ toast(e.message); }
}

async function rebuild(){
  if(!state.docId) return;
  try{
    const j = await api('/api/rebuild', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({doc_id:state.docId, config:collectConfig(), boundaries:state.boundaries})
    });
    state.segments = j.segments || [];
    state.checks = j.checks || null;
    refreshAll();
  }catch(e){ toast(e.message); }
}

async function doExport(){
  if(!state.docId || !state.segments.length) return;
  if(state.checks && !state.checks.consistent){ toast('覆盖校验未通过，请先修正分界点'); return; }
  toast('正在导出…');
  try{
    const j = await api('/api/export', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({doc_id:state.docId, config:collectConfig(), boundaries:state.boundaries})
    });
    state.lastExport = j;
    $('#outputPanel').classList.remove('hidden');
    $('#outDir').textContent = j.out_dir;
    let html = '';
    if(j.zip){
      html += '<div class="fileitem" style="background:var(--primary-weak);border-color:var(--primary)">'+
        '<span class="nm">全部拆分结果（ZIP 打包）</span>'+
        '<span class="pill">'+j.files.length+' 个文件</span>'+
        '<a class="btn btn-primary btn-sm" href="/api/file?p='+encodeURIComponent(j.zip)+
        '" download="split_result.zip"><span class="ic">'+ICON.down+'</span>下载 ZIP</a></div>';
    }
    html += j.files.map(f=>
      '<div class="fileitem"><span class="nm">'+esc(f.name)+'</span>'+
      '<span class="pill">'+f.pages+' 页</span>'+
      (f.inline?'<span class="pill pill-inline">含页内块</span>':'')+
      '<a class="btn btn-sm" href="/api/file?p='+encodeURIComponent(f.path)+
      '" download="'+esc(f.name)+'"><span class="ic">'+ICON.down+'</span>下载</a></div>').join('');
    $('#fileList').innerHTML = html;
    $('#outputPanel').scrollIntoView({behavior:'smooth', block:'nearest'});
    toast('已导出 '+j.files.length+' 个文件');
  }catch(e){ toast(e.message); }
}

/* ---------- 模式切换 ---------- */

function setMode(m){
  if(state.mode === m) return;
  state.mode = m;
  document.body.classList.remove('mode-single','mode-batch');
  document.body.classList.add('mode-'+m);
  document.querySelectorAll('#modeToggle .seg-btn').forEach(b=>
    b.classList.toggle('active', b.dataset.view === m));
  refreshAll();
}

/* ---------- 批量拆分 ---------- */

function fileToB64(file){
  return new Promise((res, rej)=>{
    const r = new FileReader();
    r.onload = ()=>{
      const s = r.result || '';          // data:application/pdf;base64,....
      res(s.slice(s.indexOf(',') + 1));
    };
    r.onerror = ()=> rej(new Error('文件读取失败：'+file.name));
    r.readAsDataURL(file);
  });
}

function addBatchFiles(fileList){
  const arr = [...fileList].filter(f=>/\.pdf$/i.test(f.name));
  if(!arr.length){ toast('请选择 PDF 文件'); return; }
  let added = 0;
  for(const f of arr){
    if(state.batchFiles.some(x=>x.name === f.name)) continue;
    state.batchFiles.push({name:f.name, file:f});
    added++;
  }
  renderBatchFiles();
  if(added) toast('已加入 '+state.batchFiles.length+' 个文件');
}

function renderBatchFiles(){
  const box = $('#batchFiles');
  $('#batchCount').textContent = state.batchFiles.length + ' 个文件';
  $('#btnBatchRun').disabled = !state.batchFiles.length;
  if(!state.batchFiles.length){ box.innerHTML='<div class="empty">尚未选择文件</div>'; return; }
  box.innerHTML = state.batchFiles.map((x,i)=>
    '<div class="fileitem"><span class="nm">'+esc(x.name)+'</span>'+
    '<button class="btn btn-sm btn-danger" data-del="'+i+'"><span class="ic">'+ICON.trash+'</span>移除</button></div>'
  ).join('');
}

async function runBatch(){
  if(!state.batchFiles.length) return;
  $('#btnBatchRun').disabled = true;
  toast('正在批量拆分…');
  try{
    const items = [];
    for(const x of state.batchFiles){
      items.push({filename:x.name, b64: await fileToB64(x.file)});
    }
    const j = await api('/api/batch', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({items, config: collectConfig()})
    });
    state.lastBatch = j;
    renderBatchResults(j);
    toast('完成 '+j.done+'/'+j.count+'，共 '+j.total_segments+' 段');
  }catch(e){ toast(e.message); }
  finally{ $('#btnBatchRun').disabled = !state.batchFiles.length; }
}

function renderBatchResults(j){
  $('#batchResult').classList.remove('hidden');
  $('#batchSummary').textContent = '成功 '+j.done+'/'+j.count+' · 共 '+j.total_segments+' 段';
  let html = '';
  if(j.zip){
    html += '<div class="fileitem" style="background:var(--primary-weak);border-color:var(--primary)">'+
      '<span class="nm">全部结果（总包 ZIP）</span>'+
      '<span class="pill">'+j.total_segments+' 段</span>'+
      '<a class="btn btn-primary btn-sm" href="/api/file?p='+encodeURIComponent(j.zip)+
      '" download="batch_result.zip"><span class="ic">'+ICON.down+'</span>下载总包</a></div>';
  }
  html += j.results.map(r=>{
    if(r.error){
      return '<div class="fileitem" style="border-color:var(--danger);background:var(--danger-weak)">'+
        '<span class="nm">'+esc(r.name)+'</span>'+
        '<span class="pill" style="color:var(--danger);border-color:#f3c3be">失败</span>'+
        '<span class="sub" style="color:var(--danger)">'+esc(r.error)+'</span></div>';
    }
    const perZip = r.zip
      ? '<a class="btn btn-sm" href="/api/file?p='+encodeURIComponent(r.zip)+'" download><span class="ic">'+ICON.down+'</span>该文件ZIP</a>'
      : '';
    return '<div class="fileitem"><span class="nm">'+esc(r.name)+'</span>'+
      '<span class="pill">'+r.page_count+' 页</span>'+
      '<span class="pill">'+r.segments+' 段</span>'+ perZip +'</div>';
  }).join('');
  $('#batchResultList').innerHTML = html;
  $('#batchResult').scrollIntoView({behavior:'smooth', block:'nearest'});
}

/* ---------- 事件绑定 ---------- */

$('#dropzone').onclick = ()=> $('#fileInput').click();
$('#fileInput').onchange = e => { openFile(e.target.files[0]); e.target.value=''; };
['dragenter','dragover'].forEach(ev=>
  $('#dropzone').addEventListener(ev, e=>{ e.preventDefault(); $('#dropzone').classList.add('hover'); }));
['dragleave','drop'].forEach(ev=>
  $('#dropzone').addEventListener(ev, e=>{ e.preventDefault(); $('#dropzone').classList.remove('hover'); }));
$('#dropzone').addEventListener('drop', e=>{ if(e.dataTransfer.files[0]) openFile(e.dataTransfer.files[0]); });

$('#btnDetect').onclick = doDetect;
$('#btnExport').onclick = doExport;

$('#thumbs').addEventListener('click', e=>{
  const el = e.target.closest('.thumb'); if(!el) return;
  state.sel = +el.dataset.p; refreshAll();
});

$('#segments').addEventListener('click', e=>{
  const b = e.target.closest('button[data-act]'); if(!b) return;
  const seg = state.segments[+b.dataset.i]; if(!seg) return;
  const idx = b.dataset.act === 'merge' ? seg.bi : seg.bi + 1;
  if(idx < 0 || idx >= state.boundaries.length){ toast('这一段没有可合并的分界点'); return; }
  state.boundaries.splice(idx,1);
  rebuild();
});

$('#segments').addEventListener('change', e=>{
  const el = e.target.closest('.seg-name'); if(!el) return;
  const seg = state.segments[+el.dataset.i]; if(!seg || seg.bi < 0){ refreshAll(); return; }
  state.boundaries[seg.bi].name = el.value.trim() || '未命名';
  rebuild();
});

$('#btnInsert').onclick = ()=>{
  if(!state.docId) return;
  const pct = Math.max(0, Math.min(95, parseFloat($('#insPos').value || '0')));
  const name = $('#insName').value.trim();
  const page = state.sel;
  const h = (state.pages[page-1]||{}).height || 842;
  const offset = pct === 0 ? 0 : Math.round(h * pct / 100);
  if(state.boundaries.some(b=>b.page===page && Math.abs(b.offset-offset) < 4)){
    toast('该位置已有分界点'); return;
  }
  state.boundaries.push({page, offset, name: name || ('第'+page+'页分界'), source:'manual', matched:''});
  state.boundaries.sort((a,b)=> a.page-b.page || a.offset-b.offset);
  $('#insName').value = '';
  rebuild();
  toast('已在第 '+page+' 页'+(offset?(' '+pct+'% 处'):'顶部')+'插入分界点');
};

$('#btnAddRule').onclick = ()=>{
  state.config.rules.push({name:'新材料', type:'keyword', pattern:'', scope:'top', inline:false, name_from:'rule', enabled:true});
  renderRuleTable(); saveRules();
};
$('#btnLoadRule').onclick = async ()=>{
  try{
    const j = await api('/api/rules');
    applyConfig(j.config); toast('已读取默认规则');
  }catch(e){ toast(e.message); }
};
$('#btnExpRule').onclick = ()=>{
  const blob = new Blob([JSON.stringify(collectConfig(), null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'pdf_split_rules.json';
  a.click(); URL.revokeObjectURL(a.href);
};
$('#btnImpRule').onclick = ()=> $('#ruleInput').click();
$('#ruleInput').onchange = e=>{
  const f = e.target.files[0]; e.target.value='';
  if(!f) return;
  const rd = new FileReader();
  rd.onload = ()=>{ try{ applyConfig(JSON.parse(rd.result)); toast('已导入规则'); }
    catch(err){ toast('规则文件格式错误'); } };
  rd.readAsText(f, 'utf-8');
};

['#optOutline','#optInline','#optOrphan','#optExclude','#optFilename','#optOrphanName']
  .forEach(sel=> $(sel).addEventListener('change', saveRules));

/* 模式切换 */
document.querySelectorAll('#modeToggle .seg-btn').forEach(b=>
  b.onclick = ()=> setMode(b.dataset.view));

/* 批量拆分交互 */
$('#batchDrop').onclick = ()=> $('#batchInput').click();
$('#batchInput').onchange = e=>{ addBatchFiles(e.target.files); e.target.value=''; };
['dragenter','dragover'].forEach(ev=>
  $('#batchDrop').addEventListener(ev, e=>{ e.preventDefault(); $('#batchDrop').classList.add('hover'); }));
['dragleave','drop'].forEach(ev=>
  $('#batchDrop').addEventListener(ev, e=>{ e.preventDefault(); $('#batchDrop').classList.remove('hover'); }));
$('#batchDrop').addEventListener('drop', e=>{ if(e.dataTransfer.files.length) addBatchFiles(e.dataTransfer.files); });
$('#btnBatchRun').onclick = runBatch;
$('#btnBatchClear').onclick = ()=>{
  state.batchFiles = []; state.lastBatch = null;
  $('#batchResult').classList.add('hidden');
  renderBatchFiles();
};
$('#batchFiles').addEventListener('click', e=>{
  const b = e.target.closest('button[data-del]'); if(!b) return;
  state.batchFiles.splice(+b.dataset.del, 1);
  renderBatchFiles();
});

/* ---------- 初始化 ---------- */

(async function init(){
  try{
    const j = await api('/api/rules');
    const saved = localStorage.getItem('wb_pdfsplit_rules');
    applyConfig(saved ? JSON.parse(saved) : j.config);
  }catch(e){
    state.config = {use_outline:true, outline_levels:[1,2], rules:[], options:{}};
  }
  refreshAll();
})();
</script>
</body>
</html>
